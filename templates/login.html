<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <main>
        <h2>Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash_message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Username</label>
            <input type="text" name="username" id="username">

            <label for="password">Password</label>
            <input type="password" name="password" id="password">

            <button type="submit">Login</button>
        </form>
        <br><br><br>
        <p style="margin: 3px 0px 3px 14px">Forgot Username?<a href="{{ url_for('forgot_username') }}">Click Here</a></p>
        <p style="margin: 3px 0px 3px 15px">Forgot Password?<a href="{{ url_for('forgot_password') }}">Reset Here</a></p>
        <p style="margin: 3px 0px 3px 5px">Don't have an account?<a href="{{ url_for('register') }}">Register Here</a></p>
    </main>
</body>
</html>
