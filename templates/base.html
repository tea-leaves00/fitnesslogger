<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fitness Logger{% endblock %}</title>
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    {% block header %}
    <header class="section_header">
        <div class="header_actions">
            <a href="{{ url_for('weightlifting_index') }}" class="switch_button">Weightlifting</a>
            <a href="{{ url_for('cardio_index') }}" class="switch_button">Cardio</a>
            <a href="{{ url_for('logout') }}" class="logout_button">Logout</a>
        </div>
    </header>
    {% endblock %}

    {% block navigation %}{% endblock %}

    <main>
    {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; 2026 FitnessLogger
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
